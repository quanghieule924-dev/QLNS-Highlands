<!DOCTYPE html>
{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Quản lý nhân sự Highlands{% endblock %}</title>
    <!-- Nhúng Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Nhúng FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/common.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="public-layout">

    <!-- GỌI HEADER DÙNG CHUNG -->
    {% include 'partials/public_header.html' %}

    <!-- NỘI DUNG CHÍNH -->
    <main class="page-content">
        {% block content %}
        {% endblock %}
    </main>

    <!-- GỌI FOOTER DÙNG CHUNG -->
    {% include 'partials/public_footer.html' %}

    <!-- =================================================== -->
    <!-- THÊM KHỐI NÀY VÀO ĐÂY ĐỂ CÁC TRANG CON CHẠY ĐƯỢC JAVASCRIPT -->
    <!-- =================================================== -->
    {% block extra_js %}{% endblock %}
</body>
</html>
